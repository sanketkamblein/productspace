  <text x="690" y="62" text-anchor="middle" font-size="13" font-weight="800" fill="rgba(74,222,128,0.85)">With AR Assistant</text>
  <text x="690" y="78" text-anchor="middle" font-size="9.5" fill="rgba(255,255,255,0.3)">~2 min · AI-assisted · 1 surface · 1 click</text>

