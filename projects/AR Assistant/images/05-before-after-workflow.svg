  <text x="94" y="228" font-size="9.5" font-weight="600" fill="rgba(255,255,255,0.65)">Check Credit Mgmt for risk class</text>
  <text x="94" y="244" font-size="8.5" fill="rgba(255,255,255,0.3)">Separate tab · No unified view</text>
  <line x1="210" y1="254" x2="210" y2="268" stroke="rgba(248,113,113,0.25)" stroke-width="1.5" stroke-dasharray="3 3"/>
