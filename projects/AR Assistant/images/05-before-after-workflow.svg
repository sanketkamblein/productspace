  <text x="572" y="124" font-size="8.5" fill="rgba(255,255,255,0.3)">System-generated · AI-ranked overnight</text>
  <line x1="690" y1="134" x2="690" y2="148" stroke="rgba(34,197,94,0.3)" stroke-width="1.5"/>
  <text x="746" y="144" font-size="8" fill="rgba(74,222,128,0.6)">~30 sec</text>

  <rect x="526" y="150" width="326" height="44" rx="8" fill="rgba(34,197,94,0.06)" stroke="rgba(34,197,94,0.2)" stroke-width="1"/>
  <circle cx="550" cy="172" r="12" fill="rgba(34,197,94,0.2)" stroke="rgba(34,197,94,0.4)" stroke-width="1"/>
  <text x="550" y="177" text-anchor="middle" font-size="10" font-weight="900" fill="rgba(74,222,128,0.9)">2</text>
  <text x="572" y="168" font-size="9.5" font-weight="600" fill="rgba(255,255,255,0.65)">Tap account → 360° view loads instantly</text>
  <text x="572" y="184" font-size="8.5" fill="rgba(255,255,255,0.3)">All data aggregated by agent — zero navigation</text>
  <line x1="690" y1="194" x2="690" y2="208" stroke="rgba(34,197,94,0.3)" stroke-width="1.5"/>
  <text x="746" y="204" font-size="8" fill="rgba(74,222,128,0.6)">~20 sec</text>

  <rect x="526" y="210" width="326" height="44" rx="8" fill="rgba(34,197,94,0.06)" stroke="rgba(34,197,94,0.2)" stroke-width="1"/>
  <circle cx="550" cy="232" r="12" fill="rgba(34,197,94,0.2)" stroke="rgba(34,197,94,0.4)" stroke-width="1"/>
  <text x="550" y="237" text-anchor="middle" font-size="10" font-weight="900" fill="rgba(74,222,128,0.9)">3</text>
  <text x="572" y="228" font-size="9.5" font-weight="600" fill="rgba(255,255,255,0.65)">Review recommended actions inline</text>
  <text x="572" y="244" font-size="8.5" fill="rgba(255,255,255,0.3)">Pre-computed by AI · No navigation needed</text>
  <line x1="690" y1="254" x2="690" y2="268" stroke="rgba(34,197,94,0.3)" stroke-width="1.5"/>
  <text x="746" y="264" font-size="8" fill="rgba(74,222,128,0.6)">~20 sec</text>

  <rect x="526" y="270" width="326" height="88" rx="8" fill="rgba(34,197,94,0.09)" stroke="rgba(34,197,94,0.3)" stroke-width="1.5"/>
  <text x="572" y="292" font-size="9.5" font-weight="700" fill="rgba(74,222,128,0.9)">4. Make the call · Take action in EL</text>
  <text x="572" y="308" font-size="8.5" fill="rgba(74,222,128,0.55)">Log PTP · Set dunning block · Add note</text>
  <text x="572" y="322" font-size="8.5" fill="rgba(74,222,128,0.55)">Without leaving the Engagement Layer</text>
  <!-- mini action chips -->
  <rect x="572" y="333" width="88" height="18" rx="5" fill="rgba(34,197,94,0.15)" stroke="rgba(34,197,94,0.25)" stroke-width="1"/>
  <text x="616" y="345" text-anchor="middle" font-size="7.5" fill="rgba(134,239,172,0.9)" font-weight="700">✓ Log PTP</text>
  <rect x="668" y="333" width="120" height="18" rx="5" fill="rgba(59,130,246,0.15)" stroke="rgba(59,130,246,0.25)" stroke-width="1"/>
  <text x="728" y="345" text-anchor="middle" font-size="7.5" fill="rgba(147,197,253,0.9)" font-weight="700">📝 Call Notes</text>

  <!-- After total badge -->
  <rect x="526" y="390" width="200" height="22" rx="11" fill="rgba(34,197,94,0.08)" stroke="rgba(34,197,94,0.25)" stroke-width="1"/>
  <text x="626" y="405" text-anchor="middle" font-size="9" font-weight="700" fill="rgba(74,222,128,0.8)">Total: ~2 min · 15 min saved</text>
