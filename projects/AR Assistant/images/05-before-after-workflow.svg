  <circle cx="72" cy="292" r="12" fill="rgba(248,113,113,0.15)" stroke="rgba(248,113,113,0.3)" stroke-width="1"/>
  <text x="72" y="297" text-anchor="middle" font-size="10" font-weight="900" fill="rgba(248,113,113,0.8)">4</text>
  <text x="94" y="288" font-size="9.5" font-weight="600" fill="rgba(255,255,255,0.65)">Check disputes · Scan email threads</text>
  <text x="94" y="304" font-size="8.5" fill="rgba(255,255,255,0.3)">Outlook + Dispute Mgmt in parallel</text>
  <line x1="210" y1="314" x2="210" y2="328" stroke="rgba(248,113,113,0.25)" stroke-width="1.5" stroke-dasharray="3 3"/>
