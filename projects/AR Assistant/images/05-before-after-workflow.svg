  <!-- ── LEFT — Before ── -->
  <text x="210" y="62" text-anchor="middle" font-size="13" font-weight="800" fill="rgba(248,113,113,0.85)">Before AR Assistant</text>
  <text x="210" y="78" text-anchor="middle" font-size="9.5" fill="rgba(255,255,255,0.3)">~20 min · Manual · 5+ screens · Pure willpower</text>

  <!-- Step boxes — before -->
  <!-- Step 1 -->
  <rect x="48" y="90" width="326" height="44" rx="8" fill="rgba(248,113,113,0.07)" stroke="rgba(248,113,113,0.2)" stroke-width="1"/>
  <circle cx="72" cy="112" r="12" fill="rgba(248,113,113,0.15)" stroke="rgba(248,113,113,0.3)" stroke-width="1"/>
  <text x="72" y="117" text-anchor="middle" font-size="10" font-weight="900" fill="rgba(248,113,113,0.8)">1</text>
  <text x="94" y="108" font-size="9.5" font-weight="600" fill="rgba(255,255,255,0.65)">Open SAP Collections Worklist</text>
  <text x="94" y="124" font-size="8.5" fill="rgba(255,255,255,0.3)">Manually scan 200+ accounts — no ranking</text>
  <!-- connector -->
  <line x1="210" y1="134" x2="210" y2="148" stroke="rgba(248,113,113,0.25)" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="270" y="144" font-size="8" fill="rgba(248,113,113,0.5)">3–4 min</text>

  <rect x="48" y="150" width="326" height="44" rx="8" fill="rgba(248,113,113,0.07)" stroke="rgba(248,113,113,0.2)" stroke-width="1"/>
  <circle cx="72" cy="172" r="12" fill="rgba(248,113,113,0.15)" stroke="rgba(248,113,113,0.3)" stroke-width="1"/>
  <text x="72" y="177" text-anchor="middle" font-size="10" font-weight="900" fill="rgba(248,113,113,0.8)">2</text>
  <text x="94" y="168" font-size="9.5" font-weight="600" fill="rgba(255,255,255,0.65)">Navigate to FI-AR · Find open items</text>
  <text x="94" y="184" font-size="8.5" fill="rgba(255,255,255,0.3)">T-code navigation · Filter by customer</text>
  <line x1="210" y1="194" x2="210" y2="208" stroke="rgba(248,113,113,0.25)" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="270" y="204" font-size="8" fill="rgba(248,113,113,0.5)">3–4 min</text>

  <rect x="48" y="210" width="326" height="44" rx="8" fill="rgba(248,113,113,0.07)" stroke="rgba(248,113,113,0.2)" stroke-width="1"/>
  <circle cx="72" cy="232" r="12" fill="rgba(248,113,113,0.15)" stroke="rgba(248,113,113,0.3)" stroke-width="1"/>
