  <rect x="526" y="90" width="326" height="44" rx="8" fill="rgba(34,197,94,0.06)" stroke="rgba(34,197,94,0.2)" stroke-width="1"/>
  <circle cx="550" cy="112" r="12" fill="rgba(34,197,94,0.2)" stroke="rgba(34,197,94,0.4)" stroke-width="1"/>
  <text x="550" y="117" text-anchor="middle" font-size="10" font-weight="900" fill="rgba(74,222,128,0.9)">1</text>
