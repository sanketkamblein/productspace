  <rect x="48" y="330" width="326" height="48" rx="8" fill="rgba(248,113,113,0.12)" stroke="rgba(248,113,113,0.35)" stroke-width="1.5"/>
  <text x="94" y="350" font-size="9.5" font-weight="700" fill="rgba(248,113,113,0.9)">5. Mentally piece it all together → Make call</text>
  <text x="94" y="366" font-size="8.5" fill="rgba(248,113,113,0.55)">Fragmented context · High cognitive load</text>

  <!-- Before total badge -->
  <rect x="48" y="390" width="200" height="22" rx="11" fill="rgba(248,113,113,0.08)" stroke="rgba(248,113,113,0.25)" stroke-width="1"/>
  <text x="148" y="405" text-anchor="middle" font-size="9" font-weight="700" fill="rgba(248,113,113,0.8)">Total: ~20 min avg · Up to 30 min</text>

  <!-- ── DIVIDER ── -->
  <line x1="450" y1="54" x2="450" y2="386" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <circle cx="450" cy="220" r="18" fill="#0c1628" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="450" y="225" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.2)" font-weight="700">vs</text>

