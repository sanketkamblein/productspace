<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 680" font-family="Georgia, 'Times New Roman', serif">

  <rect width="1100" height="680" fill="#0a0a0a"/>

  <!-- ══ SECTION LABEL ══ -->
  <text x="60" y="56" font-family="Georgia, serif" font-size="11" fill="rgba(255,255,255,0.5)" letter-spacing="4" font-style="italic">the</text>
  <text x="88" y="56" font-family="Georgia, serif" font-size="22" fill="#fff" font-weight="700" letter-spacing="1">problem space</text>
  <line x1="60" y1="64" x2="360" y2="64" stroke="rgba(255,255,255,0.35)" stroke-width="1.5"/>

  <!-- ══════════════════════════════════
       PROBLEM 01 — LEFT
  ══════════════════════════════════ -->

  <!-- Problem number -->
  <text x="60" y="108" font-family="Georgia, serif" font-size="72" fill="rgba(255,255,255,0.06)" font-weight="700">01</text>
  <text x="62" y="104" font-family="Georgia, serif" font-size="11" fill="rgba(255,255,255,0.5)" letter-spacing="3" font-style="italic">problem</text>

  <!-- Problem headline -->
  <text x="62" y="132" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="700" fill="#fff">Understanding customer payment behaviour</text>
  <text x="62" y="152" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="700" fill="#fff">is slow and fragmented</text>
  <text x="62" y="174" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="rgba(255,255,255,0.5)" letter-spacing="1">COLLECTION SPECIALIST · LEGACY SAP APPS INCLUDING FIORI</text>

  <!-- Key insight text block -->
  <text x="62" y="210" font-family="-apple-system, sans-serif" font-size="11" fill="rgba(255,255,255,0.85)">To understand a single customer's payment behaviour, a Collection</text>
  <text x="62" y="228" font-family="-apple-system, sans-serif" font-size="11" fill="rgba(255,255,255,0.85)">Specialist must manually open SAP FI/AR, Credit Management,</text>
  <text x="62" y="246" font-family="-apple-system, sans-serif" font-size="11" fill="rgba(255,255,255,0.85)">Collections Worklist, and Outlook — switching context each time.</text>
  <text x="62" y="272" font-family="-apple-system, sans-serif" font-size="11" fill="rgba(255,255,255,0.5)">There is no single surface that shows payment history, risk level,</text>
  <text x="62" y="288" font-family="-apple-system, sans-serif" font-size="11" fill="rgba(255,255,255,0.5)">open disputes, and credit score together. The specialist builds</text>
  <text x="62" y="304" font-family="-apple-system, sans-serif" font-size="11" fill="rgba(255,255,255,0.5)">this picture entirely in their head — every single account, every day.</text>

  <!-- Illustration — person at multiple screens (starts below text) -->
  <!-- Person sitting between screens — head at y=360 -->
  <circle cx="166" cy="360" r="14" fill="none" stroke="#fff" stroke-width="2.5"/>
  <!-- Glasses -->
  <rect x="158" y="356" width="8" height="6" rx="2" fill="none" stroke="rgba(255,255,255,0.9)" stroke-width="1.5"/>
  <rect x="168" y="356" width="8" height="6" rx="2" fill="none" stroke="rgba(255,255,255,0.9)" stroke-width="1.5"/>
  <line x1="166" y1="359" x2="168" y2="359" stroke="rgba(255,255,255,0.8)" stroke-width="1.5"/>
  <!-- Frustrated expression — flat mouth -->
  <line x1="161" y1="369" x2="171" y2="369" stroke="rgba(255,255,255,0.7)" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Body -->
  <ellipse cx="166" cy="394" rx="14" ry="16" fill="none" stroke="#fff" stroke-width="2.5"/>
  <!-- Arms reaching to both sides -->
  <line x1="152" y1="388" x2="136" y2="402" stroke="rgba(255,255,255,0.85)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="180" y1="388" x2="198" y2="398" stroke="rgba(255,255,255,0.85)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Screen 1 — SAP FI/AR (left) -->
  <rect x="68" y="398" width="52" height="48" rx="3" fill="none" stroke="rgba(255,255,255,0.75)" stroke-width="2"/>
  <rect x="75" y="405" width="38" height="28" rx="1" fill="rgba(255,255,255,0.06)"/>
  <rect x="75" y="405" width="38" height="5" fill="rgba(255,255,255,0.15)"/>
  <line x1="75" y1="415" x2="113" y2="415" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>
  <line x1="75" y1="421" x2="113" y2="421" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>
  <line x1="75" y1="427" x2="107" y2="427" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>

  <!-- Screen 2 — Credit Mgmt (centre) -->
  <rect x="140" y="388" width="52" height="58" rx="3" fill="none" stroke="rgba(255,255,255,0.75)" stroke-width="2"/>
  <rect x="147" y="395" width="38" height="38" rx="1" fill="rgba(255,255,255,0.06)"/>
  <rect x="147" y="395" width="38" height="5" fill="rgba(255,255,255,0.15)"/>
  <path d="M158,425 A14,14 0 0 1 186,425" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="2"/>
  <path d="M158,425 A14,14 0 0 1 174,412" fill="none" stroke="rgba(255,255,255,0.8)" stroke-width="2.5"/>
  <circle cx="174" cy="412" r="2.5" fill="#fff"/>

  <!-- Screen 3 — Collections Worklist (right) -->
  <rect x="212" y="398" width="52" height="48" rx="3" fill="none" stroke="rgba(255,255,255,0.75)" stroke-width="2"/>
  <rect x="219" y="405" width="38" height="28" rx="1" fill="rgba(255,255,255,0.06)"/>
  <rect x="219" y="405" width="38" height="5" fill="rgba(255,255,255,0.15)"/>
  <line x1="219" y1="415" x2="257" y2="415" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>
  <line x1="219" y1="421" x2="257" y2="421" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>
  <line x1="219" y1="427" x2="250" y2="427" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>

  <!-- Desk surface -->
  <rect x="62" y="448" width="220" height="5" rx="2" fill="rgba(255,255,255,0.3)"/>

  <!-- Screen labels -->
  <text x="94" y="462" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="7.5" fill="rgba(255,255,255,0.5)">FI / AR</text>
  <text x="166" y="462" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="7.5" fill="rgba(255,255,255,0.5)">Credit</text>
  <text x="238" y="462" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="7.5" fill="rgba(255,255,255,0.5)">Worklist</text>

  <!-- "5 screens" annotation -->
  <line x1="290" y1="418" x2="330" y2="418" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
  <circle cx="330" cy="418" r="3" fill="rgba(255,255,255,0.5)"/>
  <text x="340" y="414" font-family="-apple-system, sans-serif" font-size="9.5" fill="rgba(255,255,255,0.65)">5+ screens</text>
  <text x="340" y="428" font-family="-apple-system, sans-serif" font-size="9.5" fill="rgba(255,255,255,0.65)">no unified view</text>

  <!-- Time cost -->
  <text x="62" y="502" font-family="Georgia, serif" font-size="32" font-weight="700" fill="#fff">20–30</text>
  <text x="62" y="524" font-family="-apple-system, sans-serif" font-size="10" fill="rgba(255,255,255,0.5)" letter-spacing="1">MINUTES PER ACCOUNT · PURELY ON RESEARCH</text>

  <!-- Thin rule -->
  <line x1="62" y1="540" x2="480" y2="540" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>

  <!-- ══════════════════════════════════
       VERTICAL DIVIDER
  ══════════════════════════════════ -->
  <line x1="550" y1="80" x2="550" y2="620" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>

  <!-- ══════════════════════════════════
       PROBLEM 02 — RIGHT
  ══════════════════════════════════ -->

  <!-- Problem number -->
  <text x="590" y="108" font-family="Georgia, serif" font-size="72" fill="rgba(255,255,255,0.06)" font-weight="700">02</text>
  <text x="592" y="104" font-family="Georgia, serif" font-size="11" fill="rgba(255,255,255,0.5)" letter-spacing="3" font-style="italic">problem</text>

  <!-- Problem headline -->
  <text x="592" y="132" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="700" fill="#fff">Dispute resolution is a manual,</text>
  <text x="592" y="152" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="700" fill="#fff">comment-driven process</text>
  <text x="592" y="174" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="rgba(255,255,255,0.5)" letter-spacing="1">AR ANALYST · DISPUTE MANAGEMENT · NO AUTOMATION</text>

  <!-- Key insight text block -->
  <text x="592" y="210" font-family="-apple-system, sans-serif" font-size="11" fill="rgba(255,255,255,0.85)">Dispute resolution is entirely process-driven. Each step requires</text>
  <text x="592" y="228" font-family="-apple-system, sans-serif" font-size="11" fill="rgba(255,255,255,0.85)">manual action — no automation, no prioritisation, no routing.</text>
  <text x="592" y="254" font-family="-apple-system, sans-serif" font-size="11" fill="rgba(255,255,255,0.5)">Worse — the AR Analyst (Accounting Manager) learns the status</text>
  <text x="592" y="272" font-family="-apple-system, sans-serif" font-size="11" fill="rgba(255,255,255,0.5)">of a dispute only by reading free-text comments left on the case.</text>
  <text x="592" y="290" font-family="-apple-system, sans-serif" font-size="11" fill="rgba(255,255,255,0.5)">There is no structured summary, no AI-assisted routing, and no</text>
  <text x="592" y="308" font-family="-apple-system, sans-serif" font-size="11" fill="rgba(255,255,255,0.5)">visibility into which disputes are close to resolution.</text>

  <!-- Illustration — dispute case with comment thread -->
  <!-- Case document -->
  <rect x="592" y="328" width="180" height="130" rx="4" fill="none" stroke="rgba(255,255,255,0.75)" stroke-width="2"/>
  <!-- Header bar -->
  <rect x="592" y="328" width="180" height="18" rx="4" fill="rgba(255,255,255,0.12)"/>
  <rect x="592" y="340" width="180" height="6" fill="rgba(255,255,255,0.12)"/>
  <text x="682" y="341" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="8" fill="rgba(255,255,255,0.7)" font-weight="700">DISPUTE CASE #4821</text>
  <!-- Comment bubbles stacked -->
  <!-- Comment 1 -->
  <rect x="604" y="354" width="130" height="20" rx="3" fill="rgba(255,255,255,0.07)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <circle cx="612" cy="364" r="5" fill="rgba(255,255,255,0.2)"/>
  <line x1="622" y1="361" x2="726" y2="361" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  <line x1="622" y1="367" x2="710" y2="367" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  <!-- Comment 2 -->
  <rect x="604" y="380" width="130" height="20" rx="3" fill="rgba(255,255,255,0.07)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <circle cx="612" cy="390" r="5" fill="rgba(255,255,255,0.2)"/>
  <line x1="622" y1="387" x2="726" y2="387" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  <line x1="622" y1="393" x2="700" y2="393" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  <!-- Comment 3 -->
  <rect x="604" y="406" width="130" height="20" rx="3" fill="rgba(255,255,255,0.07)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <circle cx="612" cy="416" r="5" fill="rgba(255,255,255,0.2)"/>
  <line x1="622" y1="413" x2="726" y2="413" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  <line x1="622" y1="419" x2="718" y2="419" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  <!-- Comment 4 (last, cut off) -->
  <rect x="604" y="432" width="130" height="20" rx="3" fill="rgba(255,255,255,0.07)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <circle cx="612" cy="442" r="5" fill="rgba(255,255,255,0.2)"/>
  <line x1="622" y1="439" x2="726" y2="439" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  <line x1="622" y1="445" x2="705" y2="445" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>

  <!-- Analyst figure reading comments — right of document -->
  <!-- Head -->
  <circle cx="836" cy="360" r="14" fill="none" stroke="#fff" stroke-width="2.5"/>
  <!-- Eyes — squinting to read -->
  <line x1="829" y1="357" x2="834" y2="357" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="838" y1="357" x2="843" y2="357" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Neutral mouth -->
  <path d="M831,365 Q836,368 841,365" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Body -->
  <ellipse cx="836" cy="394" rx="14" ry="16" fill="none" stroke="#fff" stroke-width="2.5"/>
  <!-- Arms forward — reading posture -->
  <line x1="822" y1="388" x2="800" y2="400" stroke="rgba(255,255,255,0.85)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="850" y1="388" x2="862" y2="396" stroke="rgba(255,255,255,0.85)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Arrow from analyst eyes to document -->
  <line x1="820" y1="362" x2="782" y2="395" stroke="rgba(255,255,255,0.3)" stroke-width="1.5" stroke-dasharray="4 3"/>
  <circle cx="782" cy="395" r="3" fill="rgba(255,255,255,0.4)"/>

  <!-- "reads comments to understand" annotation -->
  <line x1="855" y1="362" x2="900" y2="340" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
  <circle cx="900" cy="340" r="3" fill="rgba(255,255,255,0.4)"/>
  <text x="910" y="337" font-family="-apple-system, sans-serif" font-size="9.5" fill="rgba(255,255,255,0.65)">Analyst reads comments</text>
  <text x="910" y="351" font-family="-apple-system, sans-serif" font-size="9.5" fill="rgba(255,255,255,0.65)">to understand dispute</text>
  <text x="910" y="365" font-family="-apple-system, sans-serif" font-size="9.5" fill="rgba(255,255,255,0.65)">— no structured summary</text>

  <!-- "no automation" badge -->
  <text x="592" y="490" font-family="Georgia, serif" font-size="32" font-weight="700" fill="#fff">0%</text>
  <text x="592" y="516" font-family="-apple-system, sans-serif" font-size="10" fill="rgba(255,255,255,0.5)" letter-spacing="1">AUTOMATION · EVERY STEP IS A MANUAL HUMAN ACTION</text>

  <line x1="592" y1="532" x2="1050" y2="532" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>

  <!-- ══ FOOTER ══ -->
  <text x="550" y="648" text-anchor="middle" font-family="Georgia, serif" font-size="9.5" fill="rgba(255,255,255,0.28)" font-style="italic" letter-spacing="3">both problems compound — each account takes longer than it should</text>

</svg>
