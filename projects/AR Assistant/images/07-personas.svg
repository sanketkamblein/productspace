<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 680" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="bg7" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#060c18"/>
      <stop offset="100%" stop-color="#0a1628"/>
    </linearGradient>
    <linearGradient id="ara-head" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#032d60"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="cs-head" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2e0761"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="card-drop">
      <feDropShadow dx="0" dy="10" stdDeviation="22" flood-color="rgba(0,0,0,0.55)"/>
    </filter>
  </defs>

  <rect width="980" height="680" fill="url(#bg7)"/>

  <!-- Title row -->
  <text x="490" y="34" text-anchor="middle" font-size="10" font-weight="800" fill="rgba(255,255,255,0.18)" letter-spacing="2.5">ACCOUNTS RECEIVABLE TEAM — TWO PERSONAS</text>

  <!-- ══════════════════════════════════════════════
       LEFT — AR ACCOUNTANT
  ════════════════════════════════════════════════ -->
  <g filter="url(#card-drop)">
    <rect x="28" y="50" width="452" height="610" rx="16" fill="#0c1830" stroke="rgba(29,78,216,0.22)" stroke-width="1"/>
  </g>
  <!-- Header -->
  <rect x="28" y="50" width="452" height="64" rx="16" fill="url(#ara-head)"/>
  <rect x="28" y="98" width="452" height="16" fill="url(#ara-head)"/>
  <circle cx="70" cy="82" r="20" fill="rgba(255,255,255,0.14)" stroke="rgba(255,255,255,0.22)" stroke-width="1"/>
  <text x="70" y="88" text-anchor="middle" font-size="18">📊</text>
  <text x="100" y="76" font-size="14" font-weight="800" fill="#fff">AR Accountant</text>
  <text x="100" y="93" font-size="8.5" fill="rgba(255,255,255,0.55)">Analyzes and processes high-priority customer accounts</text>

  <!-- Primary Goal -->
  <rect x="44" y="128" width="420" height="56" rx="8" fill="rgba(29,78,216,0.1)" stroke="rgba(29,78,216,0.2)" stroke-width="1"/>
  <text x="58" y="146" font-size="8" font-weight="800" fill="rgba(147,197,253,0.7)" letter-spacing="1.2">PRIMARY GOAL</text>
  <text x="58" y="162" font-size="8.5" fill="rgba(255,255,255,0.7)">Analyze and process high-priority customer accounts</text>
  <text x="58" y="176" font-size="8.5" fill="rgba(255,255,255,0.7)">to create actionable prioritized lists for collection efforts</text>

  <!-- Key Responsibilities -->
  <text x="44" y="208" font-size="8" font-weight="800" fill="rgba(147,197,253,0.6)" letter-spacing="1.2">KEY RESPONSIBILITIES</text>
  <line x1="44" y1="212" x2="464" y2="212" stroke="rgba(147,197,253,0.12)" stroke-width="1"/>

  <!-- 6 responsibility chips (2 columns) -->
  <rect x="44"  y="218" width="198" height="26" rx="6" fill="rgba(29,78,216,0.1)" stroke="rgba(29,78,216,0.18)" stroke-width="1"/>
  <text x="54"  y="235" font-size="8" fill="rgba(255,255,255,0.65)">📋 Evaluate receivable amounts</text>
  <rect x="250" y="218" width="214" height="26" rx="6" fill="rgba(29,78,216,0.1)" stroke="rgba(29,78,216,0.18)" stroke-width="1"/>
  <text x="260" y="235" font-size="8" fill="rgba(255,255,255,0.65)">⚖️ Review &amp; categorize disputes</text>

  <rect x="44"  y="250" width="198" height="26" rx="6" fill="rgba(29,78,216,0.1)" stroke="rgba(29,78,216,0.18)" stroke-width="1"/>
  <text x="54"  y="267" font-size="8" fill="rgba(255,255,255,0.65)">💳 Check credit information</text>
  <rect x="250" y="250" width="214" height="26" rx="6" fill="rgba(29,78,216,0.1)" stroke="rgba(29,78,216,0.18)" stroke-width="1"/>
  <text x="260" y="267" font-size="8" fill="rgba(255,255,255,0.65)">📅 Analyze due amounts by period</text>

  <rect x="44"  y="282" width="198" height="26" rx="6" fill="rgba(29,78,216,0.1)" stroke="rgba(29,78,216,0.18)" stroke-width="1"/>
  <text x="54"  y="299" font-size="8" fill="rgba(255,255,255,0.65)">🏆 Create prioritized account lists</text>
  <rect x="250" y="282" width="214" height="26" rx="6" fill="rgba(29,78,216,0.1)" stroke="rgba(29,78,216,0.18)" stroke-width="1"/>
  <text x="260" y="299" font-size="8" fill="rgba(255,255,255,0.65)">📈 Generate account status reports</text>

  <!-- Typical Workflow -->
  <text x="44" y="334" font-size="8" font-weight="800" fill="rgba(147,197,253,0.6)" letter-spacing="1.2">TYPICAL WORKFLOW</text>
  <line x1="44" y1="338" x2="464" y2="338" stroke="rgba(147,197,253,0.12)" stroke-width="1"/>

  <!-- Step 1 -->
  <circle cx="64" cy="360" r="14" fill="rgba(29,78,216,0.25)" stroke="rgba(29,78,216,0.4)" stroke-width="1"/>
  <text x="64" y="365" text-anchor="middle" font-size="9" font-weight="800" fill="rgba(147,197,253,0.9)">1</text>
  <text x="86" y="356" font-size="9" font-weight="700" fill="rgba(255,255,255,0.75)">Data Analysis</text>
  <text x="86" y="370" font-size="8" fill="rgba(255,255,255,0.4)">Review receivables data and aging reports</text>
  <line x1="64" y1="374" x2="64" y2="392" stroke="rgba(29,78,216,0.3)" stroke-width="1" stroke-dasharray="3 2"/>

  <!-- Step 2 -->
  <circle cx="64" cy="406" r="14" fill="rgba(29,78,216,0.25)" stroke="rgba(29,78,216,0.4)" stroke-width="1"/>
  <text x="64" y="411" text-anchor="middle" font-size="9" font-weight="800" fill="rgba(147,197,253,0.9)">2</text>
  <text x="86" y="402" font-size="9" font-weight="700" fill="rgba(255,255,255,0.75)">Account Evaluation</text>
  <text x="86" y="416" font-size="8" fill="rgba(255,255,255,0.4)">Assess credit risk and dispute status</text>
  <line x1="64" y1="420" x2="64" y2="438" stroke="rgba(29,78,216,0.3)" stroke-width="1" stroke-dasharray="3 2"/>

  <!-- Step 3 -->
  <circle cx="64" cy="452" r="14" fill="rgba(29,78,216,0.25)" stroke="rgba(29,78,216,0.4)" stroke-width="1"/>
  <text x="64" y="457" text-anchor="middle" font-size="9" font-weight="800" fill="rgba(147,197,253,0.9)">3</text>
  <text x="86" y="448" font-size="9" font-weight="700" fill="rgba(255,255,255,0.75)">Actions in Accounts</text>
  <text x="86" y="462" font-size="8" fill="rgba(255,255,255,0.4)">Manage disputes, dunning and operations</text>

  <!-- Pain points -->
  <text x="44" y="500" font-size="8" font-weight="800" fill="rgba(248,113,113,0.65)" letter-spacing="1.2">CURRENT PAIN POINTS</text>
  <line x1="44" y1="504" x2="464" y2="504" stroke="rgba(248,113,113,0.12)" stroke-width="1"/>
  <text x="54" y="522" font-size="8" fill="rgba(255,255,255,0.5)">⚠ Manual prioritization across multiple parameters</text>
  <text x="54" y="538" font-size="8" fill="rgba(255,255,255,0.5)">⚠ Scattered customer data across systems</text>
  <text x="54" y="554" font-size="8" fill="rgba(255,255,255,0.5)">⚠ Time-consuming dispute tracking</text>
  <text x="54" y="570" font-size="8" fill="rgba(255,255,255,0.5)">⚠ High dependency on individual judgment</text>

  <!-- AI requirements -->
  <text x="44" y="598" font-size="8" font-weight="800" fill="rgba(74,222,128,0.65)" letter-spacing="1.2">AI APPLICATION REQUIREMENTS</text>
  <line x1="44" y1="602" x2="464" y2="602" stroke="rgba(74,222,128,0.12)" stroke-width="1"/>
  <text x="54" y="620" font-size="8" fill="rgba(255,255,255,0.5)">✦ Automated customer prioritization</text>
  <text x="54" y="636" font-size="8" fill="rgba(255,255,255,0.5)">✦ Consolidated view: receivables, disputes, credit data</text>
  <text x="54" y="652" font-size="8" fill="rgba(255,255,255,0.5)">✦ Risk scoring &amp; recommendation engine</text>


  <!-- ══════════════════════════════════════════════
       RIGHT — COLLECTION SPECIALIST
  ════════════════════════════════════════════════ -->
  <g filter="url(#card-drop)">
    <rect x="500" y="50" width="452" height="610" rx="16" fill="#0c1830" stroke="rgba(124,58,237,0.22)" stroke-width="1"/>
  </g>
  <rect x="500" y="50" width="452" height="64" rx="16" fill="url(#cs-head)"/>
  <rect x="500" y="98" width="452" height="16" fill="url(#cs-head)"/>
  <circle cx="542" cy="82" r="20" fill="rgba(255,255,255,0.14)" stroke="rgba(255,255,255,0.22)" stroke-width="1"/>
  <text x="542" y="88" text-anchor="middle" font-size="18">📞</text>
  <text x="572" y="76" font-size="14" font-weight="800" fill="#fff">Collection Specialist</text>
  <text x="572" y="93" font-size="8.5" fill="rgba(255,255,255,0.55)">Executes collection activities on prioritized accounts</text>

  <!-- Primary Goal -->
  <rect x="516" y="128" width="420" height="56" rx="8" fill="rgba(124,58,237,0.1)" stroke="rgba(124,58,237,0.2)" stroke-width="1"/>
  <text x="530" y="146" font-size="8" font-weight="800" fill="rgba(196,181,253,0.7)" letter-spacing="1.2">PRIMARY GOAL</text>
  <text x="530" y="162" font-size="8.5" fill="rgba(255,255,255,0.7)">Settle receivables from prioritized customers through</text>
  <text x="530" y="176" font-size="8.5" fill="rgba(255,255,255,0.7)">direct communication and payment arrangement management</text>

  <!-- Key Responsibilities -->
  <text x="516" y="208" font-size="8" font-weight="800" fill="rgba(196,181,253,0.6)" letter-spacing="1.2">KEY RESPONSIBILITIES</text>
  <line x1="516" y1="212" x2="936" y2="212" stroke="rgba(196,181,253,0.12)" stroke-width="1"/>

  <rect x="516" y="218" width="198" height="26" rx="6" fill="rgba(124,58,237,0.1)" stroke="rgba(124,58,237,0.18)" stroke-width="1"/>
  <text x="526" y="235" font-size="8" fill="rgba(255,255,255,0.65)">✉️ Execute email &amp; phone actions</text>
  <rect x="722" y="218" width="214" height="26" rx="6" fill="rgba(124,58,237,0.1)" stroke="rgba(124,58,237,0.18)" stroke-width="1"/>
  <text x="732" y="235" font-size="8" fill="rgba(255,255,255,0.65)">🔄 Handle resubmission cases</text>

  <rect x="516" y="250" width="198" height="26" rx="6" fill="rgba(124,58,237,0.1)" stroke="rgba(124,58,237,0.18)" stroke-width="1"/>
  <text x="526" y="267" font-size="8" fill="rgba(255,255,255,0.65)">🤝 Track Promise-to-Pay agreements</text>
  <rect x="722" y="250" width="214" height="26" rx="6" fill="rgba(124,58,237,0.1)" stroke="rgba(124,58,237,0.18)" stroke-width="1"/>
  <text x="732" y="267" font-size="8" fill="rgba(255,255,255,0.65)">💰 Manage payment closure processes</text>

  <rect x="516" y="282" width="198" height="26" rx="6" fill="rgba(124,58,237,0.1)" stroke="rgba(124,58,237,0.18)" stroke-width="1"/>
  <text x="526" y="299" font-size="8" fill="rgba(255,255,255,0.65)">⚙️ Update account status in system</text>
  <rect x="722" y="282" width="214" height="26" rx="6" fill="rgba(124,58,237,0.1)" stroke="rgba(124,58,237,0.18)" stroke-width="1"/>
  <text x="732" y="299" font-size="8" fill="rgba(255,255,255,0.65)">📝 Document all customer interactions</text>

  <!-- Typical Workflow -->
  <text x="516" y="334" font-size="8" font-weight="800" fill="rgba(196,181,253,0.6)" letter-spacing="1.2">TYPICAL WORKFLOW</text>
  <line x1="516" y1="338" x2="936" y2="338" stroke="rgba(196,181,253,0.12)" stroke-width="1"/>

  <!-- 5 steps -->
  <circle cx="536" cy="360" r="14" fill="rgba(124,58,237,0.25)" stroke="rgba(124,58,237,0.4)" stroke-width="1"/>
  <text x="536" y="365" text-anchor="middle" font-size="9" font-weight="800" fill="rgba(196,181,253,0.9)">1</text>
  <text x="558" y="356" font-size="9" font-weight="700" fill="rgba(255,255,255,0.75)">Account Review</text>
  <text x="558" y="370" font-size="8" fill="rgba(255,255,255,0.4)">Receive prioritized list from AR Accountant</text>
  <line x1="536" y1="374" x2="536" y2="390" stroke="rgba(124,58,237,0.3)" stroke-width="1" stroke-dasharray="3 2"/>

  <circle cx="536" cy="404" r="14" fill="rgba(124,58,237,0.25)" stroke="rgba(124,58,237,0.4)" stroke-width="1"/>
  <text x="536" y="409" text-anchor="middle" font-size="9" font-weight="800" fill="rgba(196,181,253,0.9)">2</text>
  <text x="558" y="400" font-size="9" font-weight="700" fill="rgba(255,255,255,0.75)">Customer Contact</text>
  <text x="558" y="414" font-size="8" fill="rgba(255,255,255,0.4)">Initiate collection via email or phone</text>
  <line x1="536" y1="418" x2="536" y2="434" stroke="rgba(124,58,237,0.3)" stroke-width="1" stroke-dasharray="3 2"/>

  <circle cx="536" cy="448" r="14" fill="rgba(124,58,237,0.25)" stroke="rgba(124,58,237,0.4)" stroke-width="1"/>
  <text x="536" y="453" text-anchor="middle" font-size="9" font-weight="800" fill="rgba(196,181,253,0.9)">3</text>
  <text x="558" y="444" font-size="9" font-weight="700" fill="rgba(255,255,255,0.75)">Payment Arrangement</text>
  <text x="558" y="458" font-size="8" fill="rgba(255,255,255,0.4)">Negotiate and document payment plans</text>
  <line x1="536" y1="462" x2="536" y2="478" stroke="rgba(124,58,237,0.3)" stroke-width="1" stroke-dasharray="3 2"/>

  <circle cx="536" cy="492" r="14" fill="rgba(124,58,237,0.25)" stroke="rgba(124,58,237,0.4)" stroke-width="1"/>
  <text x="536" y="497" text-anchor="middle" font-size="9" font-weight="800" fill="rgba(196,181,253,0.9)">4</text>
  <text x="558" y="488" font-size="9" font-weight="700" fill="rgba(255,255,255,0.75)">Follow-up</text>
  <text x="558" y="502" font-size="8" fill="rgba(255,255,255,0.4)">Monitor Promise-to-Pay agreements</text>
  <line x1="536" y1="506" x2="536" y2="522" stroke="rgba(124,58,237,0.3)" stroke-width="1" stroke-dasharray="3 2"/>

  <circle cx="536" cy="536" r="14" fill="rgba(34,197,94,0.25)" stroke="rgba(34,197,94,0.4)" stroke-width="1"/>
  <text x="536" y="541" text-anchor="middle" font-size="9" font-weight="800" fill="rgba(134,239,172,0.9)">5</text>
  <text x="558" y="532" font-size="9" font-weight="700" fill="rgba(255,255,255,0.75)">Action on Account</text>
  <text x="558" y="546" font-size="8" fill="rgba(255,255,255,0.4)">Finish the task in worklist — close or escalate</text>

  <!-- AI requirements -->
  <text x="516" y="582" font-size="8" font-weight="800" fill="rgba(74,222,128,0.65)" letter-spacing="1.2">AI APPLICATION REQUIREMENTS</text>
  <line x1="516" y1="586" x2="936" y2="586" stroke="rgba(74,222,128,0.12)" stroke-width="1"/>
  <text x="526" y="604" font-size="8" fill="rgba(255,255,255,0.5)">✦ Suggested next-best action per account</text>
  <text x="526" y="620" font-size="8" fill="rgba(255,255,255,0.5)">✦ Automated communication drafts (email / call scripts)</text>
  <text x="526" y="636" font-size="8" fill="rgba(255,255,255,0.5)">✦ Promise-to-Pay tracking &amp; automated alerts</text>
  <text x="526" y="652" font-size="8" fill="rgba(255,255,255,0.5)">✦ Limited visibility into payment commitments → solved</text>

  <text x="490" y="672" text-anchor="middle" font-size="8.5" fill="rgba(255,255,255,0.1)" font-weight="600" letter-spacing="2">SOURCE: FIGMA DESIGN THINKING BOARD — AR ASSISTANT PROJECT</text>
</svg>
