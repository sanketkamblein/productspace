<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conversations — Joule Engagement Layer</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    /* ── Sub-nav conversation cards ── */
    .conv-card-avatar img {
      width: 18px;
      height: 18px;
      filter: brightness(0) invert(1);
    }

    /* ── Header icon buttons — EL .toolbar-right-btn style ── */
    .header-icon-btn {
      width: 36px;
      height: 36px;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #E8E8E8;
      border: 1px solid #BCC3CA;
      cursor: pointer;
      transition: background 0.15s;
      flex-shrink: 0;
    }
    .header-icon-btn:hover { background: #dcdcdc; }

    /* ── Sub-nav toggle transition ── */
    .sub-nav {
      transition: width 0.3s ease, min-width 0.3s ease, opacity 0.3s ease;
    }
    .sub-nav.collapsed {
      width: 0 !important;
      min-width: 0 !important;
      opacity: 0;
      overflow: hidden;
      padding: 0;
    }

    /* ── Toolbar toggle btn — EL .toolbar-btn style ── */
    .toolbar-toggle-btn {
      height: 36px;
      padding: 8px 12px;
      border-radius: 20px;
      display: flex; align-items: center; justify-content: center;
      background: #E2D8FC;
      border: 1px solid #5D36FF;
      cursor: pointer;
      transition: background 0.15s; flex-shrink: 0;
    }
    .toolbar-toggle-btn:hover { background: #d0c4f7; }

    /* ── Conversation breadcrumb ── */
    .conv-breadcrumb {
      font-size: 12px;
      color: #556b82;
      margin-bottom: 2px;
    }
    .conv-header-title {
      font-size: 16px;
      font-weight: 700;
      color: #131e29;
      line-height: 1.2;
    }

    /* ── Filter tabs — EL .filter-pill style (overrides global) ── */
    /* Global styles.css already updated; these ensure specificity */

    /* ── Joule input pill buttons ── */
    .joule-input-pill-btn {
      display: flex;
      align-items: center;
      gap: 5px;
      background: #f5f6f7;
      border: none;
      border-radius: 20px;
      padding: 5px 10px;
      font-size: 13px;
      color: #556b82;
      cursor: pointer;
      transition: background 0.15s;
      font-family: inherit;
      font-weight: 500;
    }
    .joule-input-pill-btn:hover { background: #ebebeb; }

    .joule-ai-footer {
      font-size: 11px;
      color: #8a9ba8;
      text-align: center;
      padding: 6px 0 2px;
    }

    /* ── Customer result list ── */
    .customer-result-list {
      display: flex;
      flex-direction: column;
      width: 100%;
      max-width: 560px;
    }
    .customer-result-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 0;
      border-bottom: 1px solid #f0f0f0;
      gap: 12px;
    }
    .customer-result-item:last-child { border-bottom: none; }
    .customer-result-left { flex: 1; min-width: 0; }
    .customer-result-name {
      font-size: 14px;
      font-weight: 600;
      color: #0064d9;
      margin-bottom: 4px;
    }
    .customer-result-meta { display: flex; gap: 24px; }
    .customer-result-label { font-size: 11px; color: #8a9ba8; margin-bottom: 1px; }
    .customer-result-value { font-size: 13px; color: #131e29; }
    .customer-result-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 6px;
      flex-shrink: 0;
    }
    .risk-badge { font-size: 11px; font-weight: 600; color: #aa0808; }
    .risk-badge.high { color: #bf6900; }
    .btn-evaluate {
      background: #5d36ff;
      color: white;
      border: none;
      border-radius: 20px;
      padding: 6px 16px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
      font-family: inherit;
      white-space: nowrap;
    }
    .btn-evaluate:hover { background: #4a2acc; }

    /* ── Create Space card ── */
    .create-space-card {
      border: 1px solid #e5e5e5;
      border-radius: 12px;
      padding: 16px 20px;
      max-width: 400px;
      margin-top: 4px;
    }
    .create-space-card-title {
      font-size: 14px;
      font-weight: 700;
      color: #131e29;
      margin-bottom: 6px;
    }
    .create-space-card-desc {
      font-size: 13px;
      color: #556b82;
      margin-bottom: 14px;
      line-height: 1.4;
    }

    @keyframes spacePulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.12); opacity: 0.85; }
    }
    @keyframes spaceProgress {
      0% { width: 0%; }
      30% { width: 40%; }
      70% { width: 75%; }
      100% { width: 100%; }
    }

    /* ── Dispute tabs ── */
    .disputes-tabs {
      display: flex;
      align-items: center;
      gap: 4px;
      margin-bottom: 12px;
    }
    .dispute-tab {
      padding: 5px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      border: 1px solid transparent;
      background: transparent;
      color: #556b82;
      transition: all 0.15s;
      font-family: inherit;
    }
    .dispute-tab.active { background: #e8f3ff; color: #0064d9; border-color: #0064d9; font-weight: 600; }
    .dispute-tab-more {
      width: 28px; height: 28px;
      border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      background: transparent; border: none; cursor: pointer;
    }
    .dispute-tab-actions { margin-left: auto; display: flex; gap: 4px; }

    /* ── Dispute result items ── */
    .dispute-result-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 0;
      border-bottom: 1px solid #f0f0f0;
      gap: 12px;
    }
    .dispute-result-item:last-child { border-bottom: none; }
    .dispute-result-left { flex: 1; min-width: 0; }
    .dispute-result-id { font-size: 14px; font-weight: 600; color: #5d36ff; margin-bottom: 4px; }
    .dispute-result-company { display: inline; font-size: 14px; font-weight: 600; color: #5d36ff; }
    .dispute-result-meta { display: flex; gap: 24px; margin-top: 4px; }
    .dispute-result-label { font-size: 11px; color: #8a9ba8; margin-bottom: 1px; }
    .dispute-result-value { font-size: 13px; color: #131e29; }
    .dispute-result-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 6px;
      flex-shrink: 0;
    }
    .dispute-result-amount { font-size: 14px; font-weight: 600; color: #131e29; }
    .dispute-result-actions { display: flex; align-items: center; gap: 4px; }
    .btn-chevron {
      width: 28px; height: 28px;
      border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      background: transparent;
      border: 1px solid #e5e5e5;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-chevron:hover { background: #f5f6f7; }
  </style>
</head>
<body>
<div class="page-container">
  <!-- Vertical Nav injected by nav.js -->

  <!-- Main Panel -->
  <div class="main-panel">
    <!-- Left: Conversations Sub-Panel -->
    <div class="sub-nav">
      <div class="sub-nav-header">
        <span class="sub-nav-title">Conversations</span>
        <div class="sub-nav-actions">
          <button class="icon-btn" title="Search" onclick="toggleSearch()">
            <img src="assets/FilterCov.svg" width="16" height="16" alt=""
                 onerror="this.innerHTML='<svg width=16 height=16 viewBox=\'0 0 16 16\' fill=\'none\'><circle cx=\'7\' cy=\'7\' r=\'4.5\' stroke=\'#556B82\' stroke-width=\'1.5\'/><path d=\'M10.5 10.5l3 3\' stroke=\'#556B82\' stroke-width=\'1.5\' stroke-linecap=\'round\'/></svg>'">
          </button>
          <button class="icon-btn" title="Filter">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
              <path d="M2 4h12M4.5 8h7M7 12h2" stroke="#556B82" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
          </button>
        </div>
      </div>

      <!-- Search (hidden) -->
      <div class="search-container" id="searchContainer" style="display:none;padding:0 12px 8px">
        <div style="display:flex;align-items:center;gap:8px;background:#f5f6f7;border-radius:8px;padding:8px 12px">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
            <circle cx="6" cy="6" r="4" stroke="#556b82" stroke-width="1.3"/>
            <path d="M9 9l3 3" stroke="#556b82" stroke-width="1.3" stroke-linecap="round"/>
          </svg>
          <input type="text" placeholder="Search conversations..." id="searchInput" onInput="filterConvs('all', null, this.value)"
                 style="flex:1;border:none;background:transparent;font-size:13px;color:#131e29;outline:none;font-family:inherit">
        </div>
      </div>

      <div class="filter-tabs">
        <button class="filter-tab active" onclick="filterConvs('all', this)">All</button>
        <button class="filter-tab" onclick="filterConvs('ar', this)">AR &amp; Rec</button>
        <button class="filter-tab" onclick="filterConvs('analysis', this)">Analysis</button>
      </div>

      <div class="sub-nav-list" id="convList">
        <!-- Conversations rendered by JS -->
      </div>
    </div>

    <!-- Right: Conversation Content -->
    <div class="content-area" style="background:white">
      <header class="content-header">
        <div class="flex items-center gap-8" style="min-width:0">
          <!-- Toggle sub-nav list (toolbar-btn pattern) -->
          <button class="toolbar-toggle-btn" id="toggleConvListBtn" onclick="toggleConvList()" title="Toggle conversation list">
            <img src="assets/HeaderIcon.svg" width="18" height="18" alt=""
                 onerror="this.style.display='none';this.insertAdjacentHTML('afterend','<svg width=18 height=14 viewBox=&quot;0 0 18 14&quot; fill=&quot;none&quot;><path d=&quot;M1 2h16M1 7h16M1 12h16&quot; stroke=&quot;#556b82&quot; stroke-width=&quot;1.5&quot; stroke-linecap=&quot;round&quot;/></svg>')">
          </button>
          <div class="flex flex-col" style="min-width:0">
            <span class="conv-breadcrumb" id="convBreadcrumb">Conversations</span>
            <h1 class="conv-header-title" id="convTitle">Cash Flow Analysis</h1>
          </div>
        </div>
        <div class="flex items-center gap-8">
          <button class="btn-secondary" id="insightsBtn" style="font-size:12px;padding:5px 12px;display:none">
            <svg width="13" height="13" viewBox="0 0 13 13" fill="none">
              <circle cx="6.5" cy="6.5" r="5" stroke="#0070F2" stroke-width="1.3" fill="none"/>
              <path d="M6.5 4v3.5l2 1.5" stroke="#0070F2" stroke-width="1.3" stroke-linecap="round"/>
            </svg>
            Insights
          </button>
          <!-- Three-dot menu -->
          <div style="position:relative">
            <button class="header-icon-btn" title="More options" onclick="toggleFloatingMenu(this)">
              <img src="assets/more-icon.svg" width="16" height="16" alt=""
                   onerror="this.innerHTML='<svg width=16 height=4 viewBox=\'0 0 16 4\' fill=\'none\'><circle cx=\'2\' cy=\'2\' r=\'1.5\' fill=\'#848484\'/><circle cx=\'8\' cy=\'2\' r=\'1.5\' fill=\'#848484\'/><circle cx=\'14\' cy=\'2\' r=\'1.5\' fill=\'#848484\'/></svg>'">
            </button>
            <div class="floating-menu" id="convFloatingMenu" style="display:none;top:36px;right:0">
              <button class="floating-menu-item">Rename</button>
              <button class="floating-menu-item">Share</button>
              <button class="floating-menu-item">Add to Space</button>
              <div class="floating-menu-divider"></div>
              <button class="floating-menu-item danger">Delete</button>
            </div>
          </div>
          <!-- Add to spaces -->
          <button class="header-icon-btn" title="Add to Spaces">
            <img src="assets/add-to-spaces.svg" width="18" height="18" alt=""
                 onerror="this.innerHTML='<svg width=18 height=18 viewBox=\'0 0 18 18\' fill=\'none\'><rect x=\'2\' y=\'2\' width=\'6\' height=\'6\' rx=\'1\' stroke=\'#131E29\' stroke-width=\'1.4\' fill=\'none\'/><rect x=\'10\' y=\'2\' width=\'6\' height=\'6\' rx=\'1\' stroke=\'#131E29\' stroke-width=\'1.4\' fill=\'none\'/><rect x=\'2\' y=\'10\' width=\'6\' height=\'6\' rx=\'1\' stroke=\'#131E29\' stroke-width=\'1.4\' fill=\'none\'/><path d=\'M13 10v6M10 13h6\' stroke=\'#0070F2\' stroke-width=\'1.4\' stroke-linecap=\'round\'/></svg>'">
          </button>
          <!-- Share -->
          <button class="header-icon-btn" title="Share">
            <img src="assets/share.svg" width="18" height="18" alt=""
                 onerror="this.innerHTML='<svg width=16 height=16 viewBox=\'0 0 16 16\' fill=\'none\'><path d=\'M6 8a3 3 0 004 0l2-2a3 3 0 00-4-4l-1 1\' stroke=\'#131e29\' stroke-width=\'1.4\' stroke-linecap=\'round\' fill=\'none\'/><path d=\'M10 8a3 3 0 00-4 0L4 10a3 3 0 004 4l1-1\' stroke=\'#131e29\' stroke-width=\'1.4\' stroke-linecap=\'round\' fill=\'none\'/></svg>'">
          </button>
        </div>
      </header>

      <!-- Chat Messages -->
      <div class="chat-container scrollable" id="chatContainer">
        <!-- Messages rendered by JS -->
      </div>

      <!-- Joule Input — exact EL conversations design -->
      <div class="joule-input-wrapper">
        <div class="joule-input-box">
          <div class="joule-input-text-row">
            <textarea class="joule-input-field" placeholder="Ask Joule or create anything..." id="jouleInput" rows="1"
                      oninput="this.style.height='auto';this.style.height=this.scrollHeight+'px';updateSendBtn('convSendBtn',this.value)"></textarea>
          </div>
          <div class="joule-input-icons">
            <div class="joule-input-icons-left">
              <button class="input-action-btn primary-tint" title="Attach">
                <img src="assets/attachments-button.svg" width="18" height="18" alt=""
                     onerror="this.style.display='none'">
              </button>
              <button class="input-action-btn" title="Tools">
                <img src="assets/tools-button.svg" width="18" height="18" alt=""
                     onerror="this.style.display='none'">
              </button>
            </div>
            <div class="joule-input-icons-right">
              <button class="input-action-btn grey-bg" title="Voice">
                <img src="assets/action-button.svg" width="20" height="20" alt=""
                     onerror="this.style.display='none'">
              </button>
              <button class="space-input-send-btn" id="convSendBtn" title="Send" onclick="handleSend()">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                  <path d="M2 8h12M8 3l5 5-5 5" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </button>
            </div>
          </div>
        </div>
        <p class="joule-ai-footer">AI generated. Verify results.</p>
      </div>
    </div><!-- /content-area -->
  </div><!-- /main-panel -->
</div><!-- /page-container -->

<script src="nav.js"></script>
<script>
// ── New conversation (stay on page) ──────────────────────────
function startNewConversation() {
  const newId = 'conv-new-' + Date.now();
  allConvs.unshift({ id: newId, title: 'New Conversation', preview: '', time: 'Just now', category: 'all', tag: '', breadcrumb: 'Conversations', unread: 0 });
  renderConvList(currentFilter, '');
  // Set active
  currentConv = newId;
  document.getElementById('convBreadcrumb').textContent = 'Conversations';
  document.getElementById('convTitle').textContent = 'New Conversation';
  // Show empty state (same as index.html hero)
  const container = document.getElementById('chatContainer');
  container.innerHTML = `
    <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:24px;padding:40px">
      <div style="display:flex;flex-direction:column;align-items:center;gap:16px">
        <img src="assets/Joule_icon.svg" width="80" height="80" alt="Joule"
             onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
        <div style="display:none;width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg,#5d36ff,#a100c2);align-items:center;justify-content:center">
          <svg width="36" height="36" viewBox="0 0 36 36" fill="none"><path d="M18 4l3.5 10.5L32 18l-10.5 3.5L18 32l-3.5-10.5L4 18l10.5-3.5z" fill="white"/></svg>
        </div>
        <div style="text-align:center">
          <div style="font-size:20px;font-weight:700;color:#131e29;margin-bottom:6px">Hi, I'm Joule</div>
          <div style="font-size:14px;color:#556b82;max-width:360px;line-height:1.5">Your AI assistant across SAP. Ask me anything about your data, workflows, or processes.</div>
        </div>
      </div>
      <div style="display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:560px">
        <button onclick="document.getElementById('jouleInput').value=this.textContent;document.getElementById('jouleInput').dispatchEvent(new Event('input'));document.getElementById('jouleInput').focus()" style="background:#f0ecff;border:none;border-radius:20px;padding:8px 16px;font-size:13px;color:#5d36ff;font-weight:600;cursor:pointer;font-family:inherit;transition:background 0.15s" onmouseover="this.style.background='#e2d8ff'" onmouseout="this.style.background='#f0ecff'">Analysis &amp; Reporting</button>
        <button onclick="document.getElementById('jouleInput').value=this.textContent;document.getElementById('jouleInput').dispatchEvent(new Event('input'));document.getElementById('jouleInput').focus()" style="background:#f0ecff;border:none;border-radius:20px;padding:8px 16px;font-size:13px;color:#5d36ff;font-weight:600;cursor:pointer;font-family:inherit;transition:background 0.15s" onmouseover="this.style.background='#e2d8ff'" onmouseout="this.style.background='#f0ecff'">AR &amp; Receivables</button>
        <button onclick="document.getElementById('jouleInput').value=this.textContent;document.getElementById('jouleInput').dispatchEvent(new Event('input'));document.getElementById('jouleInput').focus()" style="background:#f0ecff;border:none;border-radius:20px;padding:8px 16px;font-size:13px;color:#5d36ff;font-weight:600;cursor:pointer;font-family:inherit;transition:background 0.15s" onmouseover="this.style.background='#e2d8ff'" onmouseout="this.style.background='#f0ecff'">Process Automation</button>
        <button onclick="document.getElementById('jouleInput').value=this.textContent;document.getElementById('jouleInput').dispatchEvent(new Event('input'));document.getElementById('jouleInput').focus()" style="background:#f0ecff;border:none;border-radius:20px;padding:8px 16px;font-size:13px;color:#5d36ff;font-weight:600;cursor:pointer;font-family:inherit;transition:background 0.15s" onmouseover="this.style.background='#e2d8ff'" onmouseout="this.style.background='#f0ecff'">Compliance &amp; Controls</button>
        <button onclick="document.getElementById('jouleInput').value=this.textContent;document.getElementById('jouleInput').dispatchEvent(new Event('input'));document.getElementById('jouleInput').focus()" style="background:#f0ecff;border:none;border-radius:20px;padding:8px 16px;font-size:13px;color:#5d36ff;font-weight:600;cursor:pointer;font-family:inherit;transition:background 0.15s" onmouseover="this.style.background='#e2d8ff'" onmouseout="this.style.background='#f0ecff'">Strategic Planning</button>
      </div>
    </div>`;
  document.getElementById('jouleInput').focus();
  // Highlight new card
  setTimeout(() => {
    document.querySelectorAll('.conv-card').forEach(el => el.classList.remove('active'));
    const card = document.querySelector(`.conv-card[onclick*="${newId}"]`);
    if (card) card.classList.add('active');
  }, 50);
}

// ── Send button gradient state ────────────────────────────────
function updateSendBtn(btnId, value) {
  const btn = document.getElementById(btnId);
  if (!btn) return;
  if (value && value.trim()) {
    btn.style.background = 'linear-gradient(135deg, #5d36ff 0%, #a100c2 100%)';
  } else {
    btn.style.background = '#e5e5e5';
  }
}

// ── Data ─────────────────────────────────────────────────────────
const CONVERSATIONS = [
  { id: 'top5-risk', title: 'Search: Top 5 risk customers', preview: 'Show me the top 5 risk customers.', time: '1h ago', category: 'ar', tag: 'AR', breadcrumb: 'Conversations', unread: 0 },
  { id: 'open-disputes', title: 'Search: Open Disputes', preview: 'Show me the 5 disputes with the biggest outstanding amount.', time: '2h ago', category: 'ar', tag: 'AR', breadcrumb: 'Conversations', unread: 2 },
  { id: 'cash-flow', title: 'Cash Flow Analysis', preview: 'What is our current cash flow variance vs. forecast this quarter?', time: '3h ago', category: 'analysis', tag: 'Analysis', breadcrumb: 'Conversations', unread: 0 },
  { id: 'dso-analysis', title: 'DSO Trend Analysis', preview: 'Why did our DSO increase from 42 to 51 days this quarter?', time: '5h ago', category: 'ar', tag: 'AR', breadcrumb: 'Conversations', unread: 0 },
  { id: 'meridian-dispute', title: 'Meridian Holding Dispute', preview: 'Help me resolve the open dispute with Meridian Holding for €14,580.', time: '1d ago', category: 'ar', tag: 'AR', breadcrumb: 'Conversations', unread: 1 },
  { id: 'collections-strategy', title: 'Collections Strategy', preview: 'Build a dunning strategy for overdue accounts above €10K.', time: '2d ago', category: 'ar', tag: 'AR', breadcrumb: 'Conversations', unread: 0 },
  { id: 'budget-variance', title: 'Q4 Budget vs Actuals', preview: 'Create a Q4 budget vs actuals variance report template.', time: '3d ago', category: 'analysis', tag: 'Analysis', breadcrumb: 'Conversations', unread: 0 },
  { id: 'working-capital', title: 'Working Capital Dashboard', preview: 'Build a working capital dashboard with DSO, DPO, and cash conversion.', time: '4d ago', category: 'analysis', tag: 'Analysis', breadcrumb: 'Conversations', unread: 0 }
];

// Message action icons using asset files
function msgActionsHTML() {
  return `<div class="msg-icon-actions">
    <button class="msg-icon-btn" title="Copy">
      <img src="assets/action-copy.svg" width="15" height="15" alt="" onerror="this.style.display='none';this.parentElement.innerHTML='<svg width=15 height=15 viewBox=&quot;0 0 15 15&quot; fill=&quot;none&quot;><rect x=&quot;5&quot; y=&quot;5&quot; width=&quot;8&quot; height=&quot;8&quot; rx=&quot;1.5&quot; stroke=&quot;#848484&quot; stroke-width=&quot;1.3&quot;/><path d=&quot;M3 10V3a1 1 0 011-1h7&quot; stroke=&quot;#848484&quot; stroke-width=&quot;1.3&quot; stroke-linecap=&quot;round&quot;/></svg>'">

function renderConvList(filter, search) {
  const list = document.getElementById('convList');
  let filtered = filter === 'all' ? allConvs : allConvs.filter(c => c.category === filter);
  if (search) filtered = filtered.filter(c =>
    c.title.toLowerCase().includes(search.toLowerCase()) ||
    c.preview.toLowerCase().includes(search.toLowerCase())
  );

  list.innerHTML = filtered.map(c => `
    <div class="conv-card ${c.id === currentConv ? 'active' : ''}" onclick="loadConv('${c.id}', this)">
      <div class="conv-card-content">
        <div class="conv-card-title">${c.title}</div>

function loadConv(id, el) {
  currentConv = id;
  // Remove active from all conv cards and mark the clicked one
  document.querySelectorAll('.conv-card').forEach(i => i.classList.remove('active'));
  if (el) el.classList.add('active');
  // Also update conv-item (legacy)
  document.querySelectorAll('.conv-item').forEach(i => i.classList.remove('active'));
  const conv = CONVERSATIONS.find(c => c.id === id);
  document.getElementById('convBreadcrumb').textContent = conv ? conv.breadcrumb : 'Conversations';
  document.getElementById('convTitle').textContent = conv ? conv.title : 'Conversation';
  renderMessages(id);
}

function setDisputeTab(btn, tab) {
  btn.closest('.disputes-tabs').querySelectorAll('.dispute-tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
}

let currentFilter = 'all';

function filterConvs(cat, btn, search) {
  if (btn) {
    document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = cat;
  }
  renderConvList(currentFilter, search || document.getElementById('searchInput')?.value || '');
}

function toggleSearch() {
  const sc = document.getElementById('searchContainer');
  sc.style.display = sc.style.display === 'none' ? 'block' : 'none';
  if (sc.style.display !== 'none') document.getElementById('searchInput').focus();
}

function toggleFloatingMenu(btn) {
  const menu = document.getElementById('convFloatingMenu');
  menu.style.display = menu.style.display === 'none' ? 'block' : 'none';
  if (menu.style.display !== 'none') {
    const close = (e) => {
      if (!btn.contains(e.target)) { menu.style.display = 'none'; document.removeEventListener('click', close); }
    };
    setTimeout(() => document.addEventListener('click', close), 0);
  }
}

function handleSend() {
  const input = document.getElementById('jouleInput');
  const text = input.value.trim();
  if (!text) return;
  const container = document.getElementById('chatContainer');
  // If this is a new conversation, set the title from the first message
  if (currentConv && currentConv.startsWith('conv-new-')) {
    const title = text.length > 40 ? text.substring(0, 37) + '…' : text;
    document.getElementById('convTitle').textContent = title;
    const conv = allConvs.find(c => c.id === currentConv);
    if (conv) conv.title = title;
    renderConvList(currentFilter, '');
    setTimeout(() => {
      document.querySelectorAll('.conv-card').forEach(el => el.classList.remove('active'));
      const card = document.querySelector(`.conv-card[onclick*="${currentConv}"]`);
      if (card) card.classList.add('active');
    }, 50);
    // Clear the empty state
    container.innerHTML = '';
  }
  container.insertAdjacentHTML('beforeend', `
    <div class="message user">
      <div><div class="message-bubble">${text}</div></div>
    </div>`);
  input.value = '';
  input.style.height = 'auto';
  updateSendBtn('convSendBtn', '');
  container.scrollTop = container.scrollHeight;
  setTimeout(() => {
    container.insertAdjacentHTML('beforeend', renderMessage({
      sender: 'joule',
      text: 'I\'m analyzing your request across the SAP data landscape. Based on current AR data, I can help you with that. Would you like me to pull a detailed report or take a specific action?'
    }));
    container.scrollTop = container.scrollHeight;
  }, 900);
}

document.getElementById('jouleInput').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleSend(); }
});

// ── Toggle conversation list panel ──────────────────────────────────
let convListOpen = true;
function toggleConvList() {
  convListOpen = !convListOpen;
  const subNav = document.querySelector('.sub-nav');
  if (convListOpen) {
    subNav.classList.remove('collapsed');
  } else {
    subNav.classList.add('collapsed');
  }
}

// Handle incoming ?msg= param
const urlParams = new URLSearchParams(window.location.search);
const incomingMsg = urlParams.get('msg');
const incomingTitle = urlParams.get('newtitle');

// Init
if (incomingMsg) {
  // Add new conversation to top of list
  const newId = 'conv-' + Date.now();
  const title = incomingTitle || (incomingMsg.length > 40 ? incomingMsg.substring(0, 37) + '…' : incomingMsg);
  allConvs.unshift({ id: newId, title, preview: incomingMsg, time: 'Just now', category: 'ar', tag: 'AR', breadcrumb: 'Conversations', unread: 0 });
  renderConvList('all');
  // Load the new conversation as active
  currentConv = newId;
  document.getElementById('convTitle').textContent = title;
  const container = document.getElementById('chatContainer');
  container.innerHTML = renderMessage({ sender: 'user', text: incomingMsg });
  // Highlight it in the list
  setTimeout(() => {
    document.querySelectorAll('.conv-card').forEach(el => el.classList.remove('active'));
    const newCard = document.querySelector(`.conv-card[onclick*="${newId}"]`);
    if (newCard) newCard.classList.add('active');
  }, 50);
  setTimeout(() => {
    const jouleReply = 'I\'m analyzing your request across the SAP data landscape. Based on current AR data, I can help you with that. Would you like me to pull a detailed report or take a specific action?';
    container.insertAdjacentHTML('beforeend', renderMessage({ sender: 'joule', text: jouleReply }));
    container.scrollTop = container.scrollHeight;
  }, 900);
} else {
  renderConvList('all');
  renderMessages('top5-risk');
}
</script>
</body>
