<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spaces — Joule Engagement Layer</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    /* ── Spaces layout ── */
    .spaces-layout {
      display: flex;
      flex: 1;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      gap: 20px;
      padding: 20px 20px 0 0;
    }

    /* ── Left panel: spaces sub-nav ── */
    .spaces-left-panel {
      width: 300px;
      min-width: 300px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: width 0.3s ease, min-width 0.3s ease, opacity 0.3s ease;
      opacity: 1;
      background: transparent;
    }
    .spaces-left-panel.collapsed {
      width: 0;
      min-width: 0;
      opacity: 0;
      overflow: hidden;
    }

    /* ── Center: space detail ── */
    .spaces-detail {
      flex: 1;
      min-width: 400px;
      display: flex;
      flex-direction: column;
      background: white;
      border-radius: 20px 20px 0 0;
      overflow: hidden;
      position: relative;
      box-shadow: 0px 4px 46px rgba(29,33,50,0.04);
    }

    .spaces-detail-header {
      padding: 14px 20px;
      border-bottom: 1px solid #e5e5e5;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .spaces-detail-breadcrumb { font-size: 11px; color: #556b82; margin-bottom: 2px; }
    .spaces-detail-title { font-size: 18px; font-weight: 700; color: #131e29; line-height: 1.2; }

    .spaces-detail-body {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      overflow-x: auto;
      padding: 0 0 100px;
    }
    .spaces-detail-body::-webkit-scrollbar { width: 5px; }
    .spaces-detail-body::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.1); border-radius: 4px; }

    /* ── Anchor section headers (Figma: Line + nav-down-arrow + Text Tab) ── */
    .section-divider {
      margin: 8px 20px 0;
      height: 1px;
      background: #e5e5e5;
    }
    .section-anchor {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 10px 20px 6px;
      cursor: pointer;
      user-select: none;
    }
    .section-anchor-arrow {
      width: 36px; height: 36px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 50%;
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
      flex-shrink: 0;
      transition: background 0.15s;
    }
    .section-anchor-arrow:hover { background: rgba(0,112,242,0.08); }
    .section-anchor-arrow svg { transition: transform 0.2s; }
    .section-anchor-arrow.collapsed svg { transform: rotate(-90deg); }
    .section-anchor-title {
      font-size: 14px;
      font-weight: 700;
      color: #0064d9;
      line-height: 1;
    }
    .section-body {
      padding: 8px 20px 24px;
      min-width: 0;
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      align-items: flex-start;
    }
    .section-body.collapsed { display: none; }

    /* ── Index pill (anchor navigator) — matches icon-btn style ── */
    .index-pill {
      display: flex;
      align-items: center;
      gap: 5px;
      background: white;
      border: 1px solid #E0E0E0;
      border-radius: 100px;
      height: 36px;
      padding: 0 12px;
      font-size: 12px;
      font-weight: 600;
      color: #0070f2;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.15s, border-color 0.15s;
      position: relative;
      white-space: nowrap;
    }
    .index-pill:hover { background: #f5f5f5; border-color: #BCC3CA; }
    .index-pill svg { flex-shrink: 0; }
    .index-dropdown {
      position: absolute;
      top: calc(100% + 6px);
      right: 0;
      min-width: 180px;
      background: white;
      border: 1px solid #e5e5e5;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.12);
      z-index: 100;
      overflow: hidden;
    }
    .index-dropdown-item {
      display: block;
      width: 100%;
      padding: 10px 16px;
      font-size: 13px;
      color: #131e29;
      background: none;
      border: none;
      text-align: left;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.12s;
    }
    .index-dropdown-item:hover { background: #f4f5f6; }
    .index-dropdown-item.active { color: #0070f2; font-weight: 600; }

    /* ── Right: Joule panel ── */
    .spaces-joule-panel {
      width: 0;
      min-width: 0;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: width 0.3s ease;
      background: white;
      position: relative;
    }
    .spaces-joule-panel.open {
      width: 360px;
      min-width: 360px;
      border-radius: 20px 20px 0 0;
      box-shadow: 0px 4px 46px rgba(29,33,50,0.04);
    }

    /* ── Joule panel header ── */
    .joule-panel-header {
      padding: 12px 16px;
      border-bottom: 1px solid #e5e5e5;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .joule-panel-title { font-size: 13px; font-weight: 700; color: #131e29; }
    .joule-panel-subtitle { font-size: 11px; color: #556b82; margin-bottom: 2px; }

    /* ── Joule panel messages ── */
    .joule-panel-messages {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 16px 16px 140px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .joule-panel-messages::-webkit-scrollbar { width: 4px; }
    .joule-panel-messages::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.1); border-radius: 4px; }

    /* ── System message ── */
    .system-msg {
      background: #f5f6f7;
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 12px;
      color: #556b82;
      line-height: 1.4;
    }
    .system-msg strong { color: #131e29; }

    /* ── Joule chat bubbles ── */
    .cp-msg-joule { display: flex; flex-direction: column; gap: 6px; }
    .cp-bubble { font-size: 14px; color: #131e29; line-height: 1.5; }
    .cp-bubble strong { font-weight: 700; }
    .cp-user-bubble {
      align-self: flex-end;
      background: #7358ff;
      color: white;
      border-radius: 16px 16px 2px 16px;
      padding: 14px;
      font-size: 14px;
      max-width: 85%;
      word-break: break-word;
    }

    /* ── Email preview ── */
    .email-preview {
      background: white;
      border: 1px solid #e5e5e5;
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 12px;
      color: #131e29;
      line-height: 1.5;
    }
    .email-preview .email-row { display: flex; gap: 6px; margin-bottom: 3px; }
    .email-preview .email-label { color: #8a9ba8; min-width: 48px; flex-shrink: 0; }
    .email-preview .email-body { margin-top: 8px; padding-top: 8px; border-top: 1px solid #f0f0f0; color: #556b82; font-size: 11.5px; }

    /* ── Action buttons ── */
    .cp-action-row { display: flex; gap: 8px; margin-top: 4px; }
    .btn-cp-action {
      padding: 6px 14px; border-radius: 20px;
      font-size: 12px; font-weight: 600;
      cursor: pointer; border: 1.5px solid #e5e5e5;
      background: white; color: #131e29;
      transition: all 0.15s; font-family: inherit;
    }
    .btn-cp-action:hover { border-color: #5d36ff; color: #5d36ff; }
    .btn-cp-action.primary { background: #5d36ff; color: white; border-color: #5d36ff; }
    .btn-cp-action.primary:hover { background: #4a2acc; }

    .reschedule-options { display: flex; flex-direction: column; gap: 6px; margin-top: 6px; }
    .reschedule-btn {
      padding: 8px 14px; border-radius: 10px;
      border: 1.5px solid #e5e5e5; background: white;
      font-size: 12px; color: #131e29; cursor: pointer;
      text-align: left; font-family: inherit; transition: all 0.15s;
    }
    .reschedule-btn:hover { border-color: #5d36ff; color: #5d36ff; }

    /* ── Msg action icons in panel ── */
    .cp-msg-actions { display: flex; align-items: center; gap: 2px; margin-top: 4px; }
    .cp-action-icon {
      width: 26px; height: 26px; border-radius: 5px;
      display: flex; align-items: center; justify-content: center;
      background: transparent; border: none; cursor: pointer;
    }
    .cp-action-icon:hover { background: #f0f0f0; }

    /* ── Joule input in panel (small) ── */
    .joule-panel-input-wrap {
      padding: 10px 14px;
      border-top: 1px solid #e5e5e5;
      flex-shrink: 0;
    }
    .joule-panel-input-box {
      background: white;
      border: 1px solid rgba(93,54,255,0.2);
      border-radius: 24px;
      padding: 8px 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .joule-panel-input-row { display: flex; align-items: center; gap: 8px; }
    .joule-panel-input-field {
      flex: 1; border: none; outline: none;
      font-size: 13px; color: #556b82;
      background: transparent; font-family: inherit;
    }
    .joule-panel-input-field::placeholder { color: #8a9ba8; font-style: italic; }
    .joule-panel-ai-footer { font-size: 10px; color: #aaa; text-align: center; padding: 4px 0 0; }

    /* ── Header icon button (Toggle, Share, Joule, Close) ── */
    .icon-btn {
      width: 32px; height: 32px;
      min-width: 32px; min-height: 32px;
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      background: transparent; border: none;
      cursor: pointer; border-radius: 8px;
      transition: background 0.15s;
    }
    .icon-btn:hover { background: rgba(0,0,0,0.06); }

    /* ── Header icon button purple (matches Engagement Layer) ── */
    .header-icon-btn-purple {
      width: 32px; height: 32px;
      background: #5d36ff; border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      border: none; cursor: pointer; flex-shrink: 0;
      transition: background 0.15s;
    }
    .header-icon-btn-purple:hover { background: #4a2acc; }

    /* ── Header actions group ── */
    .spaces-header-left {
      display: flex; align-items: center; gap: 10px;
    }
    .spaces-header-right {
      display: flex; align-items: center; gap: 8px;
    }

    /* ── Space detail tabs ── */
    .spaces-tabs {
      padding: 0 20px;
      border-bottom: 1px solid #e5e5e5;
      display: flex; align-items: center; gap: 4px;
      flex-shrink: 0;
    }
    .spaces-tab {
      padding: 10px 16px; font-size: 13px; font-weight: 400; color: #556b82;
      border: none; background: transparent; cursor: pointer; font-family: inherit;
      border-bottom: 2px solid transparent; margin-bottom: -1px; transition: all 0.15s;
    }
    .spaces-tab.active { font-weight: 600; color: #131e29; border-bottom-color: #131e29; }

    /* ── Overview cards ── */
    .space-overview-cards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 10px;
      margin-bottom: 12px;
    }
    .overview-card {
      background: white;
      border: 1px solid #e5e5e5;
      border-radius: 16px;
      padding: 16px 20px;
    }
    .overview-card-label { font-size: 12px; color: #556b82; margin-bottom: 4px; }
    .overview-card-value { font-size: 28px; font-weight: 300; color: #1d2d3e; line-height: 1.1; }
    .overview-card-unit { font-size: 14px; font-weight: 400; color: #556b82; margin-left: 4px; }
    .overview-card-trend { font-size: 11px; font-weight: 600; margin-top: 4px; display: block; }
    .overview-card-trend.up { color: #256f3a; }
    .overview-card-trend.down { color: #aa0808; }
    .overview-card-trend.warn { color: #e76500; }

    /* ── Key disputes / receivables table ── */
    .sc-table { width: 100%; border-collapse: collapse; }
    .sc-table th {
      font-size: 14px; color: #556b82; font-weight: 600; text-align: left;
      padding: 6px 8px 8px 0;
      border-bottom: 1px solid #a8b3bd;
    }
    .sc-table td {
      font-size: 14px; color: #131e29;
      padding: 10px 8px 10px 0;
      border-bottom: 1px solid #e5e5e5;
      vertical-align: middle;
    }
    .sc-table td.link { color: #0064d9; cursor: pointer; }
    .sc-table tr:last-child td { border-bottom: none; }
    .analysis-body-text { font-size: 14px; color: #556b82; line-height: 1.55; margin: 0; }

    /* ── Figma card component ── */
    .sc {
      background: white;
      border-radius: 16px;
      border: 1px solid rgba(0,0,0,0.10);
      box-shadow: 0px 2px 4px rgba(34,53,72,0.20), 0px 0px 2px rgba(34,53,72,0.20);
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      overflow: visible; /* badges can float outside */
    }
    .sc-sm  { width: 368px; }
    .sc-md  { width: 468px; }
    .sc-lg  { width: 531px; }
    .sc-xl  { width: 572px; }
    .sc-act { width: 392px; box-shadow: 0px 8px 16px rgba(34,53,72,0.12), 0px 0px 6px rgba(34,53,72,0.14); }

    /* card wrapper — positions badges strip below card */
    .sc-wrap { display: flex; flex-direction: column; gap: 4px; flex-shrink: 0; }

    /* ── Card header — no separator line, spacing only ── */
    .sc-head {
      display: flex; align-items: center; gap: 8px;
      padding: 16px 16px 12px;
    }
    /* Avatar: 64×64 rounded square, Figma fill #ded3ff, border-radius 16 */
    .sc-avatar {
      width: 64px; height: 64px; border-radius: 16px;
      background: #ded3ff; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
    }
    .sc-head-text { flex: 1; min-width: 0; }
    .sc-title  { font-size: 14px; font-weight: 700; color: #131e29; line-height: 1.15; }
    .sc-sub    { font-size: 14px; color: #556b82; margin-top: 4px; line-height: 1.15; }
    .sc-meta   { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex-shrink: 0; }
    .sc-counter{ font-size: 12px; color: #556b82; white-space: nowrap; }
    .sc-time   { font-size: 12px; color: #556b82; white-space: nowrap; }

    /* ── Badges strip (floats below card via sc-wrap) ── */
    .sc-badges { display: flex; align-items: center; gap: 4px; padding: 0 4px; }
    .sc-badge  {
      display: inline-flex; align-items: center; gap: 4px;
      font-size: 12px; font-weight: 700; line-height: 1;
      padding: 3px 8px; border-radius: 16px; white-space: nowrap;
    }
    .sc-badge.open { background: #ffdfc3; color: #b95100; }
    .sc-badge.new  { background: #0064d9; color: #ffffff; }
    /* badge dot icon (8×8) */
    .sc-badge-dot {
      width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
    }
    .sc-badge.open .sc-badge-dot { background: #b95100; }
    .sc-badge.new  .sc-badge-dot { background: #ffffff; }

    /* ── Card body — top padding only (no separator line) ── */
    .sc-body { padding: 4px 16px 16px; flex: 1; }

    /* ── Card footer — spacing only, no border line ── */
    .sc-foot {
      padding: 4px 16px 12px;
      display: flex; align-items: center; gap: 8px; justify-content: flex-end;
    }
    /* Tertiary button — no bg, no border, blue text (Figma ghost style) */
    .sc-link {
      background: none; border: none; color: #0064d9;
      font-size: 14px; font-weight: 600; cursor: pointer;
      padding: 5px 8px; font-family: inherit; border-radius: 8px;
      white-space: nowrap;
    }
    .sc-link:hover { background: rgba(0,100,217,0.06); }

    /* Joule purple CTA button (Recommendations card only) */
    .sc-foot-btns {
      padding: 4px 16px 12px;
      display: flex; align-items: center; gap: 8px;
    }
    .btn-primary {
      background: #5d36ff; color: white; border: none;
      border-radius: 8px; padding: 5px 8px;
      font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit;
      transition: background 0.15s; white-space: nowrap;
    }
    .btn-primary:hover { background: #4a28e0; }

    /* ── KPI values ── */
    .sc-kpi-val { font-size: 36px; font-weight: 300; color: #1d2d3e; line-height: 1.1; }
    .sc-kpi-unit{ font-size: 14px; font-weight: 700; color: #1d2d3e; margin-left: 4px; }
    .sc-kpi-lbl { font-size: 14px; color: #556b82; margin-top: 4px; }
    .sc-kpi-red { color: #aa0808; }

    /* ── Field rows ── */
    .sc-field { display: flex; flex-direction: column; gap: 2px; margin-bottom: 10px; }
    .sc-field:last-child { margin-bottom: 0; }
    .sc-lbl { font-size: 14px; color: #556b82; line-height: 1.15; }
    .sc-val { font-size: 14px; color: #1d2d3e; line-height: 1.15; }
    .sc-val.link { color: #0064d9; cursor: pointer; }
    .sc-val.red  { color: #aa0808; }

    /* ── Sub-nav inner (spaces list) — Figma gradient bg ── */
    .spaces-sub-inner {
      background: linear-gradient(180deg, #edf7ff 0%, #ebedff 100%);
      border-radius: 12px 12px 0 0;
      height: 100%;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── EL sidebar icon buttons ── */
    .sidebar-icon-btn {
      width: 36px; height: 36px;
      display: flex; align-items: center; justify-content: center;
      background: transparent; border: none;
      cursor: pointer; border-radius: 50%; transition: background 0.15s; flex-shrink: 0;
    }
    .sidebar-icon-btn:hover { background: rgba(0,0,0,0.05); }
    /* The + new button: small filled blue circle */
    .sidebar-icon-btn.primary {
      width: 28px; height: 28px;
      background: #0070f2; border: none; border-radius: 50%;
    }
    .sidebar-icon-btn.primary:hover { background: #005ed6; }

    /* ── Filter chips — Figma: grey border, grey text ── */
    .filter-chip {
      padding: 6px 14px; background: transparent; border: 1px solid #BCC8D4;
      border-radius: 8px; font-size: 13px; color: #354A5F; cursor: pointer;
      transition: all 0.15s; font-weight: 500; font-family: inherit;
    }
    .filter-chip:hover { background: rgba(0,0,0,0.04); }
    .filter-chip.active { background: #e8f3ff; color: #0064d9; border-color: #0064d9; }

    /* ── Space item in sub-nav — Figma: white bg, #bcddfc border, r=32, shadow ── */
    .space-item {
      background: white;
      border: 1px solid #bcddfc;
      border-radius: 32px;
      padding: 8px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      flex-direction: column;
      gap: 4px;
      text-decoration: none;
      box-shadow: 0px 4px 46px rgba(29,33,50,0.04);
      flex-shrink: 0;
    }
    .space-item:hover:not(.active) {
      border-color: #6cb8ff;
    }
    .space-item.active {
      background: white;
      border-color: #6cb8ff;
      box-shadow: 0px 4px 46px rgba(29,33,50,0.08);
    }
    .space-item-header {
      display: flex; align-items: center; gap: 8px; padding: 8px;
    }
    .space-icon-mini {
      width: 32px; height: 32px; border-radius: 50%;
      background: #c5dff5;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .space-item-info {
      display: flex; flex-direction: column; gap: 4px;
      flex: 1; min-width: 0;
    }
    .space-item-title {
      font-size: 14px; font-weight: 700; color: #131e29; line-height: 1;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .space-item-meta {
      font-size: 14px; color: #556b82; line-height: 1; font-weight: 400;
    }
    .space-item-body {
      display: flex; flex-direction: column; gap: 4px; padding: 0 8px 8px;
    }
    .space-item-desc {
      font-size: 14px; color: #556b82; line-height: 1.5; font-weight: 400;
    }
</style>
</head>
<body>
<div class="page-container">
  <!-- nav.js injected -->

  <div class="main-panel" style="overflow:hidden">
    <div class="spaces-layout">

      <!-- ── Left Panel: spaces sub-nav ── -->
      <div class="spaces-left-panel" id="spacesLeftPanel">
        <div class="spaces-sub-inner">
          <!-- Header: title + icon buttons -->
          <div style="padding:20px 20px 0;flex-shrink:0">
            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">
              <span style="font-size:20px;font-weight:700;color:#1a1a1a;letter-spacing:-0.5px">Spaces</span>
              <div style="display:flex;align-items:center;gap:4px">
                <button class="sidebar-icon-btn" id="spacesSearchBtn" onclick="toggleSpacesSearch()" title="Search">
                  <svg width="18" height="18" viewBox="0 0 20 20" fill="none">
                    <circle cx="8" cy="8" r="6" stroke="#354A5F" stroke-width="1.5"/>
                    <path d="M12.5 12.5L16 16" stroke="#354A5F" stroke-width="1.5" stroke-linecap="round"/>
                  </svg>
                </button>
                <button class="sidebar-icon-btn" id="spacesFilterBtn" onclick="toggleSpacesFilter()" title="Filter">
                  <img src="assets/FilterCov.svg" width="18" height="18" alt="Filter"
                       onerror="this.style.display='none';this.insertAdjacentHTML('afterend','<svg width=18 height=18 viewBox=&quot;0 0 20 20&quot; fill=&quot;none&quot;><path d=&quot;M3 5h14M6 10h8M9 15h2&quot; stroke=&quot;#354A5F&quot; stroke-width=&quot;1.5&quot; stroke-linecap=&quot;round&quot;/></svg>')">
                </button>
                <button class="sidebar-icon-btn primary" onclick="startNewSpace()" title="New Space">

// ── Render spaces list ───────────────────────────────────────────────
let spacesSearchQuery = '';
let spacesTypeFilter = 'all';

function renderSpacesList() {
  const list = document.getElementById('spacesList');
  let filtered = SPACES;
  if (spacesTypeFilter !== 'all') filtered = filtered.filter(s => s.type === spacesTypeFilter);
  if (spacesSearchQuery) filtered = filtered.filter(s =>
    s.title.toLowerCase().includes(spacesSearchQuery.toLowerCase()) ||
    s.desc.toLowerCase().includes(spacesSearchQuery.toLowerCase())
  );

  list.innerHTML = filtered.map(s => `
    <a href="#" class="space-item ${s.id === currentSpaceId ? 'active' : ''}" onclick="loadSpace('${s.id}'); return false;">
      <div class="space-item-header">
        <div class="space-icon-mini">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
            <rect x="1" y="1" width="5" height="5" rx="1" fill="#5d85a8"/>
            <rect x="8" y="1" width="5" height="5" rx="1" fill="#5d85a8"/>
            <rect x="1" y="8" width="5" height="5" rx="1" fill="#5d85a8"/>
            <rect x="8" y="8" width="5" height="5" rx="1" fill="#5d85a8"/>
          </svg>
        </div>
        <div class="space-item-info">
          <div class="space-item-title">${s.title}</div>
          <div class="space-item-meta">${s.type} · ${s.time}</div>
        </div>
      </div>
      <div class="space-item-body">
        <div class="space-item-desc">${s.desc}</div>
      </div>
    </a>
  `).join('');
}

function filterSpacesList(query) {
  spacesSearchQuery = query;
  renderSpacesList();
}

function filterSpacesByType(type, btn) {
  spacesTypeFilter = type;
  document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
  btn.classList.add('active');
  renderSpacesList();
}

function toggleSpacesSearch() {
  const c = document.getElementById('spacesSearchContainer');
  const isVisible = c.style.display !== 'none';
  c.style.display = isVisible ? 'none' : 'block';
  if (!isVisible) document.getElementById('spacesSearchInput').focus();
}

function toggleSpacesFilter() {
  const f = document.getElementById('spacesFilterBar');
  const isVisible = f.style.display !== 'none';
  f.style.display = isVisible ? 'none' : 'flex';
}

// ── Load space ───────────────────────────────────────────────────────
function loadSpace(id) {
  currentSpaceId = id;
  document.querySelectorAll('.space-item').forEach(i => i.classList.remove('active'));
  const el = document.querySelector(`.space-item[onclick*="${id}"]`);
  if (el) el.classList.add('active');

  const space = SPACES.find(s => s.id === id);
  if (!space) return;

  document.getElementById('spaceDetailTitle').textContent = space.detailTitle;
  document.getElementById('joulePanelTitle').textContent = space.convTitle;

  renderSpaceDetail();
  renderJoulePanelConv();

  // Existing spaces: hide bottom input, open Joule panel, hide icon
  const isNewSpace = id.startsWith('space-new-');
  document.getElementById('spacesBottomInput').style.display = isNewSpace ? 'flex' : 'none';
  if (!isNewSpace) {
    joulePanelOpen = true;
    document.getElementById('spacesJoulePanel').classList.add('open');
    document.getElementById('jouleButton').style.display = 'none';
  } else {
    joulePanelOpen = false;
    document.getElementById('spacesJoulePanel').classList.remove('open');
    document.getElementById('jouleButton').style.display = '';
  }
}

// ── Render space detail as anchor sections ──────────────────────────────
function renderSpaceDetail() {
  const sections = SPACE_SECTIONS[currentSpaceId] || [{ id: 'overview', title: 'Overview', collapsed: false, content: '' }];
  const body = document.getElementById('spaceDetailBody');

  body.innerHTML = sections.map((sec, idx) => `
    ${idx > 0 ? '<div class="section-divider"></div>' : ''}
    <div class="section-anchor" id="anchor-${sec.id}">
      <span class="section-anchor-title">${sec.title}</span>
      <button class="section-anchor-arrow ${sec.collapsed ? 'collapsed' : ''}" onclick="toggleSection('${sec.id}')" title="${sec.collapsed ? 'Expand' : 'Collapse'}">
        <svg width="10" height="6" viewBox="0 0 10 6" fill="none">
          <path d="M1 1L5 5L9 1" stroke="#0064d9" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
    <div class="section-body ${sec.collapsed ? 'collapsed' : ''}" id="section-body-${sec.id}">
      ${sec.content}
    </div>
  `).join('');

  updateIndexPill();
  // Watch scroll to update anchor pill
  body.onscroll = onDetailScroll;
}

// ── Toggle a section open/closed ─────────────────────────────────────
function toggleSection(secId) {
  const sections = SPACE_SECTIONS[currentSpaceId];
  if (!sections) return;
  const sec = sections.find(s => s.id === secId);
  if (!sec) return;
  sec.collapsed = !sec.collapsed;
  const bodyEl = document.getElementById('section-body-' + secId);
  const arrowBtn = document.querySelector('#anchor-' + secId + ' .section-anchor-arrow');
  if (bodyEl) bodyEl.classList.toggle('collapsed', sec.collapsed);
  if (arrowBtn) {
    arrowBtn.classList.toggle('collapsed', sec.collapsed);
    arrowBtn.title = sec.collapsed ? 'Expand' : 'Collapse';
  }
}

// ── Scroll watcher: update Index pill to show current visible section ──
function onDetailScroll() {
  const body = document.getElementById('spaceDetailBody');
  const sections = SPACE_SECTIONS[currentSpaceId] || [];
  if (sections.length === 0) return;
  const containerTop = body.getBoundingClientRect().top;
  // Walk sections in reverse: the last one whose anchor is at or above
  // the container top (with a small header offset) is the "active" section
  let current = sections[0];
  for (const sec of sections) {
    const el = document.getElementById('anchor-' + sec.id);
    if (!el) continue;
    const anchorTop = el.getBoundingClientRect().top - containerTop;
    if (anchorTop <= 48) {
      current = sec;
    }
  }
  document.getElementById('indexPillText').textContent = current.title;
}

// ── Index pill dropdown ───────────────────────────────────────────────
function updateIndexPill() {
  const sections = SPACE_SECTIONS[currentSpaceId] || [];
  const pillText = document.getElementById('indexPillText');
  const chevron = document.getElementById('indexPillChevron');
  const dropdown = document.getElementById('indexDropdown');

  if (sections.length > 0) pillText.textContent = sections[0].title;

  // Show chevron only when 2+ sections
  if (chevron) chevron.style.display = sections.length >= 2 ? '' : 'none';

  // Populate dropdown
  if (dropdown) {
    dropdown.innerHTML = sections.map(sec =>
      '<button class="index-dropdown-item" onclick="scrollToSection(\'' + sec.id + '\');closeIndexDropdown()">' + sec.title + '</button>'
    ).join('');
  }
}

function toggleIndexDropdown() {
  const sections = SPACE_SECTIONS[currentSpaceId] || [];
  if (sections.length < 2) return;
  const dd = document.getElementById('indexDropdown');
  const isOpen = dd.style.display !== 'none';
  dd.style.display = isOpen ? 'none' : 'block';
  if (!isOpen) {
    setTimeout(() => {
      document.addEventListener('click', closeIndexDropdownOutside);
    }, 0);
  }
}

function closeIndexDropdown() {
  document.getElementById('indexDropdown').style.display = 'none';
  document.removeEventListener('click', closeIndexDropdownOutside);
}

function closeIndexDropdownOutside(e) {
  if (!e.target.closest('#indexPillWrapper')) {
    closeIndexDropdown();
  }
}

function scrollToSection(secId) {
  // Expand if collapsed
  const sections = SPACE_SECTIONS[currentSpaceId] || [];
  const sec = sections.find(s => s.id === secId);
  if (sec && sec.collapsed) toggleSection(secId);

  const el = document.getElementById('anchor-' + secId);
  if (el) {
    el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    document.getElementById('indexPillText').textContent = sec ? sec.title : secId;
  }
}

// ── Add a new anchor section (called when Joule generates analysis) ──────
function addSpaceSection(title, contentHtml) {
  const id = title.toLowerCase().replace(/\s+/g, '-').replace(/[^a-z0-9-]/g, '');
  if (!SPACE_SECTIONS[currentSpaceId]) {
    SPACE_SECTIONS[currentSpaceId] = [];
  }
  // Avoid duplicates
  if (SPACE_SECTIONS[currentSpaceId].find(s => s.id === id)) return;
  SPACE_SECTIONS[currentSpaceId].push({ id, title, collapsed: false, content: contentHtml });
  renderSpaceDetail();
  // Scroll to new section
  setTimeout(() => scrollToSection(id), 100);
}

  const msgs = document.getElementById('joulePanelMsgs');

  msgs.innerHTML = conv.map(m => {

// ── Send from bottom input — opens Joule panel, hides input ─────────
function handleSpacesSend() {
  const inputEl = document.getElementById('spacesJouleInput');
  const text = inputEl.value.trim();
  if (!text) return;

  // Move message into Joule panel conversation
  appendJouleMsg('user', text);
  inputEl.value = '';
  updateSendBtn('spacesSendBtn', '');
  inputEl.style.height = 'auto';

  // Hide bottom input, open Joule panel, hide Joule icon
  document.getElementById('spacesBottomInput').style.display = 'none';
  document.getElementById('jouleButton').style.display = 'none';
  joulePanelOpen = true;
  document.getElementById('spacesJoulePanel').classList.add('open');

  setTimeout(() => appendJouleMsg('joule', 'I\'m analysing your request in the context of this space. I\'ll pull relevant data from your SAP environment and surface key insights here.'), 700);
}

// ── Generate a short 1-2 word section title from user message ────────
function generateSectionTitle(text) {
  // Extract key terms for a short anchor label
  const stopWords = new Set(['show','me','the','a','an','of','for','in','on','at','to','is','are','what','how','why','when','please','can','you','i','want','need']);
  const words = text.replace(/[^a-zA-Z0-9\s]/g,'').split(/\s+/).filter(w => w.length > 2 && !stopWords.has(w.toLowerCase()));
  if (words.length === 0) return text.substring(0,20);
  // Take first 2 meaningful words, capitalize
  const title = words.slice(0,2).map(w => w.charAt(0).toUpperCase() + w.slice(1).toLowerCase()).join(' ');
  return title || text.substring(0,20);
}

// ── Send from panel input ────────────────────────────────────────────
function sendJoulePanelMsg() {
  const inputEl = document.getElementById('joulePanelInput');
  const text = inputEl.value.trim();

  appendJouleMsg('user', text);
  inputEl.value = '';
  setTimeout(() => appendJouleMsg('joule', 'I\'m processing your request in the context of this space. How would you like to proceed?'), 700);
}

function appendJouleMsg(type, text) {
  const msgs = document.getElementById('joulePanelMsgs');
  if (type === 'user') {
    msgs.insertAdjacentHTML('beforeend', `<div class="cp-user-bubble">${text}</div>`);
  } else {
    msgs.insertAdjacentHTML('beforeend', `
      <div class="cp-msg-joule">
        <div class="cp-bubble">${text}</div>
        <div class="cp-msg-actions">
          <button class="cp-action-icon" title="Copy"><img src="assets/action-copy.svg" width="13" height="13" alt="" onerror="this.style.display='none'"></button>
          <button class="cp-action-icon" title="Like"><img src="assets/action-like.svg" width="13" height="13" alt="" onerror="this.style.display='none'"></button>
          <button class="cp-action-icon" title="Dislike"><img src="assets/action-dislike.svg" width="13" height="13" alt="" onerror="this.style.display='none'"></button>
        </div>
      </div>`);
  }
  msgs.scrollTop = msgs.scrollHeight;
}

}
